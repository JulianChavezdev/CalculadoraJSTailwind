<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" type="image/png" href="/src/assets/AV (1).png">
</head>
<body class="w-full min-h-dvh flex flex-col items-center justify-center p-4 bg-no-repeat bg-cover bg-center">

<h1 id="title" class="w-full text-center text-4xl sm:text-6xl md:text-7xl lg:text-8xl font-bold font-[Blinker] text-shadow-lg/30 text-white my-4 wrap-break-word px-2">
  CALCULADORA MADE BY CAPI
</h1>

<div id="box" class="flex flex-col w-full max-w-sm sm:max-w-md aspect-3/4 items-center p-4 border border-neutral-800 shadow-2xl rounded-lg bg-neutral-900 text-white">
  <div class="flex items-center justify-end bg-neutral-600 h-1/5 w-full shadow-2xl inset-shadow-neutral-800 inset-shadow-2xs rounded-lg mb-4 p-4 overflow-hidden">
    <span id="display" class="text-5xl sm:text-7xl font-[Blinker] text-white select-none whitespace-nowrap">0</span>
  </div>
  
  <div class="w-full h-4/5 grid grid-cols-4 gap-2 text-2xl sm:text-4xl">
    <button data-val="del" class="btn-light-gray">°</button>
    <button data-val="clear" class="btn-light-gray">C</button>
    <button data-val="%" class="btn-light-gray">%</button>
    <button data-val="/" class="btn-orange">/</button>
    
    <button data-val="7" class="btn-gray">7</button>
    <button data-val="8" class="btn-gray">8</button>
    <button data-val="9" class="btn-gray">9</button>
    <button data-val="*" class="btn-orange">x</button>
    
    <button data-val="4" class="btn-gray">4</button>
    <button data-val="5" class="btn-gray">5</button>
    <button data-val="6" class="btn-gray">6</button>
    <button data-val="-" class="btn-orange">-</button>
    
    <button data-val="1" class="btn-gray">1</button>
    <button data-val="2" class="btn-gray">2</button>
    <button data-val="3" class="btn-gray">3</button>
    <button data-val="+" class="btn-orange">+</button>
    
    <button data-val="+/-" class="btn-esp">+/-</button>
    <button data-val="0" class="btn-gray">0</button>
    <button data-val="," class="btn-gray">,</button>
    <button data-val="=" class="btn-orange">=</button>
  </div>
</div>

<div id="easter-egg-container" class="fixed inset-0 flex flex-col items-center justify-center bg-black/80 opacity-0 pointer-events-none z-50 transition-opacity duration-300 p-4">
  <div class="p-6 rounded-2xl shadow-2xl flex flex-col items-center w-full max-w-xs text-center bg-neutral-900">
    <h2 id="egg-title" class="text-2xl font-bold text-orange-500 mb-4">0</h2>
    <img id="egg-gif" src="" alt="Easter Egg GIF" class="w-full aspect-square object-cover rounded-xl mb-4">
    <button id="close-egg" class="px-6 py-2 bg-orange-500 text-white font-bold font-[Blinker] rounded-lg cursor-pointer transition-transform active:scale-95">
      Cerrar
    </button>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
