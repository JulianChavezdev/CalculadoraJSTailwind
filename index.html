<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body class="w-full min-h-dvh flex flex-col items-center p-1.5  justify-center bg-linear-to-br from-slate-500 to-slate-900">

<h1 id='title' class="w-full text-center text-6xl font-bold font-mono text-white mt-10">
  CALCULADORA DE CAPI
</h1>

<div id="box" class="flex flex-col h-160 w-100 items-center m-10  p-4 border border-neutral-800 shadow-2xl rounded-lg bg-neutral-900  text-white">
  <div class="flex items-center justify-end bg-white border-white h-20 w-full border rounded-lg m-2 p-0.5 ">
    <span id="display" class="text-4xl font-mono text-black select-none flex">0</span>
  </div>
  <div class="text-6xl w-full h-full grid grid-cols-4 gap-1 place-items-center ">
    <button data-val="del" class="border cursor-pointer flex pointitems-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110 shadow-2xl">°</button>
    <button data-val="clear" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">C</button>
    <button data-val="%" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">%</button>
    <button data-val="/" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-orange-400 hover:scale-110    shadow-2xl">/</button>
    <button data-val="7" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">7</button>
    <button data-val="8" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">8</button>
    <button data-val="9" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">9</button>
    <button data-val="*" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-orange-400 hover:scale-110    shadow-2xl">x</button>
    <button data-val="4" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">4</button>
    <button data-val="5" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">5</button>
    <button data-val="6" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">6</button>
    <button data-val="-" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-orange-400 hover:scale-110    shadow-2xl">-</button>
    <button data-val="1" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl0">1</button>
    <button data-val="2" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">2</button>
    <button data-val="3" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">3</button>
    <button data-val="+" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-orange-400 hover:scale-110    shadow-2xl">+</button>
    <button data-val="+/-" class="border cursor-pointer flex items-center justify-center rounded-full text-5xl h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">+/-</button>
    <button data-val="0" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">0</button>
    <button data-val="," class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-gray-400 hover:scale-110    shadow-2xl">,</button>
    <button data-val="=" class="border cursor-pointer flex items-center justify-center rounded-full h-22 w-22 bg-orange-400 hover:scale-110   shadow-2xl">=</button>
  </div>
  
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="src/main.js"></script>
</body>
</html>
