<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="icon" type="image/png" href="./src/assets/AV.png">
</head>
<body class="w-full min-h-dvh flex flex-col items-center p-1.5  justify-center bg-[url('.\assets\lined-paper-background-2329-x-3425-xpaoypaaryrzizsa.jpg')] bg-no-repeat bg-cover bg-center">

<h1 id='title' class="w-full text-center text-9xl font-bold font-[Blinker] text-shadow-lg/30  text-white mt-10">
  CALCULADORA DE CAPI
</h1>

<div id="box" class="flex flex-col h-260 w-200 items-center m-10  p-4 border border-neutral-800 shadow-2xl rounded-lg bg-neutral-900  text-white ">
  <div class="flex items-center justify-end bg-neutral-600 h-30 w-full shadow-2xl inset-shadow-orange-600 inset-shadow-2xs rounded-lg m-2 p-0.5  whitespace-nowrap ">
    <span id="display" class="text-8xl font-[Blinker] text-white select-none flex m-6">0</span>
  </div>
  <div class="text-6xl w-full h-full grid grid-cols-4 gap-1 place-items-center ">
    <button data-val="del" class="btn-light-gray">°</button>
    <button data-val="clear" class="btn-light-gray">C</button>
    <button data-val="%" class="btn-light-gray">%</button>
    <button data-val="/" class="btn-orange">/</button>
    <button data-val="7" class="btn-gray">7</button>
    <button data-val="8" class="btn-gray">8</button>
    <button data-val="9" class="btn-gray">9</button>
    <button data-val="*" class="btn-orange">x</button>
    <button data-val="4" class="btn-gray">4</button>
    <button data-val="5" class="btn-gray">5</button>
    <button data-val="6" class="btn-gray">6</button>
    <button data-val="-" class="btn-orange">-</button>
    <button data-val="1" class="btn-gray">1</button>
    <button data-val="2" class="btn-gray">2</button>
    <button data-val="3" class="btn-gray">3</button>
    <button data-val="+" class="btn-orange">+</button>
    <button data-val="+/-" class="btn-esp">+/-</button>
    <button data-val="0" class="btn-gray">0</button>
    <button data-val="," class="btn-gray">,</button>
    <button data-val="=" class="btn-orange">=</button>
  </div>
</div>
<div id="easter-egg-container" class="fixed inset-0 flex flex-col items-center justify-center bg-black/80 opacity-0 pointer-events-none z-50 transition-opacity duration-300">
  <div class="p-6 rounded-2xl  shadow-2xl flex flex-col items-center max-w-sm text-center">
    
    <h2 id="egg-title" class="text-2xl font-bold text-orange-500 mb-4">0</h2>
    
    <img id="egg-gif" src="" alt="Easter Egg GIF" class="w-120 h-120 object-cover rounded-xl mb-4">
    
    <button id="close-egg" class="px-6 py-2 bg-orange-500 text-white font-bold font-[Blinker] rounded-lg s cursor-pointer">
      Cerrar
    </button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="src/main.js"></script>
</body>
</html>
